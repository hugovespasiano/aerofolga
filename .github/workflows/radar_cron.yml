name: Radar Vigilante AeroFolga

on:
  schedule:
    # 06:00, 12:00 e 19:00 Horário de Brasília (UTC-3 -> 09:00, 15:00 e 22:00 UTC)
    - cron: '0 9,15,22 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique no app ou site do GitHub

permissions:
  contents: write

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Ronda do Vigilante de Preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/radar_vigilante_runner.py

      - name: Salvar Histórico de Menores Preços
        run: |
          git config --local user.email "bot@aerofolga.internal"
          git config --local user.name "AeroFolga Vigilante Bot"
          git add data/historico_menor_preco.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(vigilante): atualiza base de menores precos [skip ci]" && git push)
